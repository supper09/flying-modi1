<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Touch Fly — Simple Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* small helpful defaults */
    html,body { height:100%; }
    body { -webkit-tap-highlight-color: transparent; }
    .game-area { 
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      position: relative;
    }
    .game-area::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: 
        /* Multiple building layers for depth */
        polygon(0% 100%, 8% 60%, 12% 60%, 18% 80%, 22% 80%, 28% 40%, 32% 40%, 38% 70%, 42% 70%, 48% 30%, 52% 30%, 58% 85%, 62% 85%, 68% 50%, 72% 50%, 78% 75%, 82% 75%, 88% 45%, 92% 45%, 100% 65%, 100% 100%),
        /* Building windows/lights */
        radial-gradient(circle at 10% 70%, yellow 1px, transparent 2px),
        radial-gradient(circle at 15% 75%, yellow 1px, transparent 2px),
        radial-gradient(circle at 25% 50%, yellow 1px, transparent 2px),
        radial-gradient(circle at 30% 55%, yellow 1px, transparent 2px),
        radial-gradient(circle at 35% 80%, yellow 1px, transparent 2px),
        radial-gradient(circle at 45% 40%, yellow 1px, transparent 2px),
        radial-gradient(circle at 50% 45%, yellow 1px, transparent 2px),
        radial-gradient(circle at 65% 60%, yellow 1px, transparent 2px),
        radial-gradient(circle at 70% 65%, yellow 1px, transparent 2px),
        radial-gradient(circle at 85% 55%, yellow 1px, transparent 2px),
        /* Base building color */
        linear-gradient(to top, #1a1a1a 0%, #2a2a2a 100%);
      z-index: 1;
      clip-path: polygon(0% 100%, 8% 60%, 12% 60%, 18% 80%, 22% 80%, 28% 40%, 32% 40%, 38% 70%, 42% 70%, 48% 30%, 52% 30%, 58% 85%, 62% 85%, 68% 50%, 72% 50%, 78% 75%, 82% 75%, 88% 45%, 92% 45%, 100% 65%, 100% 100%);
    }
    .game-area::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to top, #000 0%, transparent 100%);
      z-index: 2;
    }
    .player, .obstacle-top, .obstacle-bottom {
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
  <div class="w-full max-w-md">
    <div class="flex items-center justify-between mb-3">
      <h1 class="text-xl font-semibold">Touch Fly</h1>
      <div class="text-right">
        <div class="text-sm text-gray-600">Score: <span id="score">0</span></div>
        <div class="text-xs text-gray-500">Best: <span id="highScore">0</span></div>
      </div>
    </div>

    <div id="stage" class="game-area relative overflow-hidden rounded-xl shadow-lg h-[640px] bg-cover" style="touch-action:none">
      <!-- Background music -->
      <audio id="bgMusic" loop>
        <source src="Uadta.mpeg" type="audio/mpeg">
        <!-- Fallback for browsers that don't support mpeg -->
        Your browser does not support the audio element.
      </audio>
      
      <!-- Game over sound effect -->
      <audio id="gameOverSound">
        <source src="Bhujam.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
      
      <!-- player and obstacles are injected by JS -->
      <div id="startScreen" class="absolute inset-0 flex items-center justify-center bg-black/50">
        <div class="bg-white p-6 rounded-xl text-center shadow">
          <h2 class="text-2xl font-bold mb-2">Flying Modi</h2>
          <p class="mb-4 text-gray-700">Touch, click, or press spacebar to fly!</p>
          <button id="startGame" class="px-6 py-3 bg-green-600 text-white rounded-lg text-lg">Start Game</button>
        </div>
      </div>
      
      <div id="overlay" class="absolute inset-0 flex items-center justify-center" style="display:none">
        <div class="bg-white/90 p-6 rounded-xl text-center shadow">
          <h2 id="overlay-title" class="text-2xl font-bold mb-2">Game Over</h2>
          <p id="overlay-score" class="mb-4 text-gray-700">Score: 0</p>
          <button id="restart" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Restart</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
